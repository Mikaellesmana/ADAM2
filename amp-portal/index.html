    <!-- Fonts are loaded once here rather than via @import inside each page's
         runtime <style> tag. A CSS @import can only be discovered after the
         style block is parsed, so those requests were serialised behind React
         mounting; a plain <link> starts them during HTML parse instead. This
         URL is the union of every weight any page uses. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@300;400;500;600&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&display=swap"
    />
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
